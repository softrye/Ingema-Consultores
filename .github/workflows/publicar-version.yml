name: InGePlus | Versiones

on:
  push:
    branches:
      - main
      # Pre-release de optimizaciones sin integrar en main.
      - claude/awesome-davinci-egn3wo
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Commit SHA de la version base (opcional)'
        required: false
        type: string
      head_sha:
        description: 'Commit SHA de destino (opcional)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: inge-version-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar-version:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout only nearby history (no LFS binaries)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          lfs: false
          persist-credentials: false

      - name: Determine the exact base and target commits
        id: refs
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_HEAD: ${{ github.sha }}
          INPUT_BASE: ${{ inputs.base_sha }}
          INPUT_HEAD: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          head="${INPUT_HEAD:-$EVENT_HEAD}"
          base="${INPUT_BASE:-$EVENT_BEFORE}"
          if [[ "${GITHUB_REF_NAME:-}" == "claude/awesome-davinci-egn3wo" && -z "$INPUT_BASE" ]]; then
            # Entire set of optimizations, not just one push.
            base="9a1ba8c7db22d807dfe500aeec85b73838e3d110"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse "$head^" 2>/dev/null || true)"
          fi
          [[ -n "$base" ]] || { echo 'Missing base SHA'; exit 1; }
          git cat-file -e "$head^{commit}" || git fetch --no-tags origin "$head" --depth=1
          git cat-file -e "$base^{commit}" || git fetch --no-tags origin "$base" --depth=1
          echo "head=$(git rev-parse "$head^{commit}")" >> "$GITHUB_OUTPUT"
          echo "base=$(git rev-parse "$base^{commit}")" >> "$GITHUB_OUTPUT"
          app_version="$(sed -nE 's/^project\(AppCalicatasDemo VERSION ([0-9]+\.[0-9]+\.[0-9]+) .*/\1/p' CMakeLists.txt | head -1)"
          [[ -n "$app_version" ]] || { echo 'Cannot read app version'; exit 1; }
          channel="beta"
          if [[ "${GITHUB_REF_NAME:-}" == "main" ]]; then channel="build"; fi
          prefix="v${app_version}-${channel}"
          last=0
          while read -r sha tag_ref; do
            tag="${tag_ref#refs/tags/}"
            [[ "$tag" == "${prefix}."* ]] || continue
            n="${tag#"${prefix}."}"
            [[ "$n" =~ ^[0-9]+$ ]] || continue
            if (( n > last )); then last="$n"; fi
          done < <(git ls-remote --tags origin "refs/tags/${prefix}.*")
          tag="${prefix}.$((last+1))"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "file=InGePlus_${tag}.zip" >> "$GITHUB_OUTPUT"

      - name: Preparar version y su instalador seguro
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach '${{ steps.refs.outputs.head }}'
          python3 .github/scripts/crear_paquete_version.py \
            --base '${{ steps.refs.outputs.base }}' \
            --head '${{ steps.refs.outputs.head }}' \
            --output '${{ steps.refs.outputs.file }}' \
            --version '${{ steps.refs.outputs.tag }}'

      - name: Publicar ZIP con numero de version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.refs.outputs.tag }}
          HEAD_SHA: ${{ steps.refs.outputs.head }}
          VERSION_FILE: ${{ steps.refs.outputs.file }}
        run: |
          set -euo pipefail
          options=()
          if [[ "${GITHUB_REF_NAME:-}" != "main" ]]; then
            options+=(--prerelease)
          fi
          gh release create "$TAG" "$VERSION_FILE" "${options[@]}" \
            --target "$HEAD_SHA" \
            --title "InGe+ Android ${TAG} - Optimizacion" \
            --notes-file "${VERSION_FILE%.zip}.md" \
            --latest=false

      - name: Retirar los tres paquetes de prueba reemplazados por versiones
        if: github.ref_name == 'claude/awesome-davinci-egn3wo'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for old in delta-db3b035b290e-37966658670 delta-de290e87a3c1-37949913147 delta-de290e87a3c1-37949826045; do
            if gh release view "$old" >/dev/null 2>&1; then
              gh release delete "$old" --yes --cleanup-tag
            fi
          done
